name: Apply smarter reminders

on:
  push:
    branches:
      - feature/smarter-care-sleep-reminders
    paths:
      - .github/workflows/apply-smarter-reminders.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smarter-care-sleep-reminders
      - run: python scripts/apply-smarter-reminders.py
      - run: npm test
        working-directory: functions
      - run: |
          rm .github/workflows/apply-smarter-reminders.yml scripts/apply-smarter-reminders.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/index.js functions/care-reminders.js functions/test/care-reminders.test.js .github/workflows/apply-smarter-reminders.yml scripts/apply-smarter-reminders.py
          git commit -m "feat: improve care notifications and add sleep reminders"
          git push origin HEAD:feature/smarter-care-sleep-reminders
