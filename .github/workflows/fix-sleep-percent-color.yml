name: Fix compact sleep percent color

on:
  push:
    branches:
      - development
    paths:
      - .github/workflows/fix-sleep-percent-color.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Patch morph percentage color
        shell: bash
        run: python3 -c 'from pathlib import Path; p=Path("src/components/FamilyAccountIconEnhancer.tsx"); s=p.read_text(); a=".twinly-primary-action-morph-button[data-morph-compact=\"true\"] .twinly-primary-action-morph-percent {\n  opacity: .72;\n}\n"; r=a+"\n.twinly-primary-action-morph-button[data-morph-action=\"sleep\"][aria-checked=\"true\"] .twinly-primary-action-morph-percent {\n  color: hsl(var(--gauge-sleep-on)) !important;\n}\n\n.twinly-primary-action-morph-button[data-morph-action=\"sleep\"][aria-checked=\"false\"] .twinly-primary-action-morph-percent {\n  color: hsl(var(--gauge-wake-on)) !important;\n}\n"; assert a in s or r in s; p.write_text(s if r in s else s.replace(a,r,1))'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-sleep-percent-color.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix compact sleep percentage color'
          git push origin HEAD:development
