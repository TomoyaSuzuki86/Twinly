name: Fix compact sleep percent color

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/fix-sleep-percent-color.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Patch morph percentage color
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/FamilyAccountIconEnhancer.tsx')
          s = p.read_text()
          anchor = '''.twinly-primary-action-morph-button[data-morph-compact="true"] .twinly-primary-action-morph-percent {
  opacity: .72;
}
'''
          replacement = '''.twinly-primary-action-morph-button[data-morph-compact="true"] .twinly-primary-action-morph-percent {
  opacity: .72;
}

.twinly-primary-action-morph-button[data-morph-action="sleep"][aria-checked="true"] .twinly-primary-action-morph-percent {
  color: hsl(var(--gauge-sleep-on)) !important;
}

.twinly-primary-action-morph-button[data-morph-action="sleep"][aria-checked="false"] .twinly-primary-action-morph-percent {
  color: hsl(var(--gauge-wake-on)) !important;
}
'''
          if replacement not in s:
              if anchor not in s:
                  raise SystemExit('anchor not found')
              s = s.replace(anchor, replacement, 1)
              p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-sleep-percent-color.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix compact sleep percentage color'
          git push origin HEAD:development
