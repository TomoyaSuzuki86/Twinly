name: Apply tutorial polish

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Prepare tutorial and compact action polish') || contains(github.event.head_commit.message, 'Run tutorial polish migration')
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply changes
        run: python3 scripts/apply-tutorial-polish.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused regression tests
        run: npx vitest run src/components/IntroTutorial.test.tsx src/components/BabyPanel.test.tsx

      - name: Static assertions
        run: |
          grep -q 'ヘッダー＝2人同時・タブ＝個別' src/App.tsx
          grep -q 'data-tutorial="log-summary"' src/components/BabyPanel.tsx
          grep -q 'ログ下の集計を、すぐ確認' src/components/IntroTutorial.tsx
          grep -q '週間タイムラインを開く' src/components/IntroTutorial.tsx
          grep -q 'foregroundToken' src/main.tsx

      - name: Build
        run: npm run build

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish compact actions and tutorial guidance"
          git push
