name: Apply tutorial exit and scroll snap

on:
  push:
    branches:
      - development
    paths:
      - .github/workflows/apply-tutorial-exit-scroll-snap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply changes
        run: python scripts/apply-tutorial-exit-scroll-snap.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tutorial regression test
        run: npx vitest run src/components/IntroTutorial.test.tsx

      - name: Build
        run: npm run build

      - name: Commit product changes and remove one-shot files
        run: |
          rm scripts/apply-tutorial-exit-scroll-snap.py
          rm .github/workflows/apply-tutorial-exit-scroll-snap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add tutorial exit and snap primary actions"
          git push origin HEAD:development
