name: Apply premium notification patch

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-premium-notification-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: add temporary premium notification patch runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Apply patch
        run: python scripts/apply-premium-notification-patch.py

      - name: Validate changes
        run: |
          npm run typecheck
          npx vitest run src/components/SettingsModal.test.tsx src/components/AiTools.test.tsx
          node --test functions/test/ai-policy.test.js functions/test/care-reminders.test.js
          node --check functions/index.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/ai-policy.js functions/index.js functions/test/ai-policy.test.js src/lib/ai.ts src/components/SettingsModal.tsx src/components/SettingsModal.test.tsx src/components/AiTools.tsx src/components/AiTools.test.tsx
          git commit -m "feat: make care notifications Premium-only"
          git push origin HEAD:master
