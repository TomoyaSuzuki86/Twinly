name: Deploy Development Preview

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-development-isolated
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: development
    env:
      TZ: Asia/Tokyo
      VITE_FIREBASE_API_KEY: ${{ secrets.DEV_VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ secrets.DEV_VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.DEV_VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.DEV_VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DEV_VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.DEV_VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.DEV_VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.DEV_VITE_GOOGLE_OAUTH_CLIENT_ID }}
      VITE_WEB_PUSH_PUBLIC_KEY: ${{ secrets.DEV_VITE_WEB_PUSH_PUBLIC_KEY }}

    steps:
      - name: Checkout development
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate development isolation
        env:
          DEV_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TWINLY_DEV }}
        run: node scripts/validate-development-config.cjs

      - name: Test isolation guard
        run: node --test scripts/validate-development-config.test.cjs

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Typecheck
        run: npm run typecheck

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Install Functions dependencies
        run: npm ci --prefix functions --prefer-offline --no-audit --fund=false

      - name: Authenticate development deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TWINLY_DEV }}

      # Deliberately exclude AI, scheduled mail and push delivery until their
      # separate development secrets and delivery destinations are configured.
      - name: Deploy development database and core Functions
        run: >-
          npx --yes firebase-tools@latest deploy
          --project "$VITE_FIREBASE_PROJECT_ID"
          --only "firestore,functions:completeFamilyOnboarding,functions:createFamilyInvite,functions:joinFamily,functions:recordFromWear,functions:undoWearRecord,functions:latestMilkElapsedFromWear,functions:getFamilyAccess,functions:setFamilyPreviewPlan,functions:getDailySummaryEmailSettings,functions:setDailySummaryEmailSettings"
          --non-interactive

      - name: Deploy development preview
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TWINLY_DEV }}
          projectId: ${{ env.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
