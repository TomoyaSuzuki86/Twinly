name: Deploy Development Preview

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-development-preview-v2
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: production
    env:
      TZ: Asia/Tokyo
      VITE_TWINLY_BILLING_DEMO: "true"
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
      VITE_WEB_PUSH_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_PUBLIC_KEY }}

    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect development billing changes
        id: billing_scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD | grep -Eq '^(functions/(development-billing-(policy|service)\.js|billing-policy\.js|stripe-client\.js|ai-service\.js|index\.js)|src/(lib/(family-access|billing|ai)(\.test)?\.ts|components/BillingPrompt\.tsx)|\.github/workflows/firebase-hosting-development\.yml)$'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Install Functions dependencies
        if: steps.billing_scope.outputs.deploy == 'true'
        run: npm ci --prefix functions --prefer-offline --no-audit --fund=false

      - name: Typecheck
        run: npm run typecheck

      - name: Test app
        run: npm test

      - name: Test Functions
        if: steps.billing_scope.outputs.deploy == 'true'
        run: npm test --prefix functions

      - name: Verify Stripe sandbox price
        if: steps.billing_scope.outputs.deploy == 'true'
        env:
          TWINLY_STRIPE_TEST_SECRET_KEY: ${{ secrets.TWINLY_STRIPE_TEST_SECRET_KEY }}
          TWINLY_STRIPE_TEST_PRICE_ID: price_1UGSA5BtBKzzWDenqD7PitXg
        run: node functions/scripts/check-stripe-sandbox.js

      - name: Build app
        run: npm run build

      - name: Authenticate to Google Cloud
        if: steps.billing_scope.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TWINLY_PROD }}

      - name: Configure development billing sandbox
        if: steps.billing_scope.outputs.deploy == 'true'
        env:
          TWINLY_STRIPE_TEST_SECRET_KEY: ${{ secrets.TWINLY_STRIPE_TEST_SECRET_KEY }}
          TWINLY_STRIPE_TEST_PRICE_ID: price_1UGSA5BtBKzzWDenqD7PitXg
        shell: bash
        run: |
          if ! gcloud secrets describe TWINLY_STRIPE_TEST_SECRET_KEY --project twinly-prod >/dev/null 2>&1; then
            printf '%s' "$TWINLY_STRIPE_TEST_SECRET_KEY" | npx --yes firebase-tools@latest functions:secrets:set TWINLY_STRIPE_TEST_SECRET_KEY --data-file - --project twinly-prod --non-interactive
          fi
          printf 'TWINLY_DEVELOPMENT_BILLING=true\nTWINLY_DEVELOPMENT_STRIPE_PRICE_ID=%s\nTWINLY_AI_MODEL=gemini-3.6-flash\nTWINLY_AI_FALLBACK_MODEL=gemini-3.5-flash-lite\n' "$TWINLY_STRIPE_TEST_PRICE_ID" > functions/.env.twinly-prod

      - name: Deploy development billing functions
        if: steps.billing_scope.outputs.deploy == 'true'
        shell: bash
        run: >-
          npx --yes firebase-tools@latest deploy
          --only functions:developmentGetFamilyAccess,functions:developmentStartFamilyTrial,functions:developmentExpireFamilyTrial,functions:developmentCreateFamilyCheckout,functions:developmentCreateFamilyBillingPortal,functions:developmentRefreshFamilyBilling,functions:developmentTwinlyAi
          --project twinly-prod
          --non-interactive

      - name: Deploy development preview
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TWINLY_PROD }}
          projectId: twinly-prod
          channelId: development
          expires: 30d
