name: Deploy Firebase Hosting

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      TZ: Asia/Tokyo
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
      VITE_WEB_PUSH_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TWINLY_PROD }}

      - name: Deploy Firebase Functions and Firestore rules
        run: >-
          npx --yes firebase-tools@latest deploy
          --only functions:sendMilkReminderNotifications,functions:completeFamilyOnboarding,functions:createFamilyInvite,functions:joinFamily,functions:recordFromWear,functions:undoWearRecord,functions:latestMilkElapsedFromWear,firestore:rules
          --project twinly-prod --non-interactive

      - name: Allow authenticated app calls to reach family functions
        run: |
          for service in completefamilyonboarding createfamilyinvite joinfamily; do
            gcloud run services add-iam-policy-binding "$service" \
              --project twinly-prod \
              --region asia-northeast1 \
              --member="allUsers" \
              --role="roles/run.invoker" \
              --quiet
          done

      - name: Verify family functions are reachable
        run: |
          status="$(curl --silent --show-error --output /tmp/complete-family-onboarding.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"data":{"nickname":"probe","relationship":"father"}}' \
            'https://asia-northeast1-twinly-prod.cloudfunctions.net/completeFamilyOnboarding')"
          test "$status" = "401"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TWINLY_PROD }}
          projectId: twinly-prod
          channelId: live
