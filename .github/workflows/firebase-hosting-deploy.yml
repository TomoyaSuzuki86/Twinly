name: Deploy Firebase

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      TZ: Asia/Tokyo
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
      VITE_WEB_PUSH_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect deployment scope
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          base="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/firebase-hosting-deploy.yml/runs?branch=master&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed="$(git ls-files)"
          else
            changed="$(git diff --name-only "$base" HEAD)"
          fi
          if grep -Eq '^(firebase\.json|\.github/workflows/firebase-hosting-deploy\.yml)$' <<< "$changed"; then
            changed="$(git ls-files)"
          fi
          if grep -Eq '^(src/|public/|index.html$|package(-lock)?\.json$|vite\.config\.|tsconfig|tailwind\.config\.|postcss\.config\.)' <<< "$changed"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^functions/' <<< "$changed"; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^firestore\.(rules|indexes\.json)$' <<< "$changed"; then
            echo "rules=true" >> "$GITHUB_OUTPUT"
          else
            echo "rules=false" >> "$GITHUB_OUTPUT"
          fi

          message="$(git log -1 --pretty=%B)"
          tagged="$(sed -n 's/.*\[deploy-function:\([^]]*\)\].*/\1/p' <<< "$message" | head -1)"
          if [ -n "$tagged" ] && [[ "$tagged" =~ ^[A-Za-z0-9_,]+$ ]] && [ "$EVENT_NAME" != "workflow_dispatch" ] && ! grep -Eq '^functions/(app-storage\.js|package(-lock)?\.json)$' <<< "$changed"; then
            selector="$(sed 's/[^,]*/functions:&/g' <<< "$tagged")"
          else
            selector="functions"
          fi
          echo "function_selector=$selector" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.scope.outputs.frontend == 'true' || steps.scope.outputs.functions == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore app dependencies
        if: steps.scope.outputs.frontend == 'true'
        id: app-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-app-${{ hashFiles('package-lock.json') }}

      - name: Restore Functions dependencies
        if: steps.scope.outputs.functions == 'true'
        id: functions-cache
        uses: actions/cache@v4
        with:
          path: functions/node_modules
          key: ${{ runner.os }}-node22-functions-${{ hashFiles('functions/package-lock.json') }}

      - name: Install only required dependencies
        if: (steps.scope.outputs.frontend == 'true' && steps.app-cache.outputs.cache-hit != 'true') || (steps.scope.outputs.functions == 'true' && steps.functions-cache.outputs.cache-hit != 'true')
        shell: bash
        run: |
          pids=""
          if [ "${{ steps.scope.outputs.frontend }}" = "true" ] && [ "${{ steps.app-cache.outputs.cache-hit }}" != "true" ]; then
            npm ci --prefer-offline --no-audit --fund=false &
            pids="$pids $!"
          fi
          if [ "${{ steps.scope.outputs.functions }}" = "true" ] && [ "${{ steps.functions-cache.outputs.cache-hit }}" != "true" ]; then
            npm ci --prefix functions --prefer-offline --no-audit --fund=false &
            pids="$pids $!"
          fi
          for pid in $pids; do wait "$pid"; done

      - name: Check changed Functions
        if: steps.scope.outputs.functions == 'true'
        run: |
          node --check functions/index.js
          node --check functions/app-storage.js
          node --test functions/test/migration.test.js

      - name: Run critical storage and auth tests
        if: steps.scope.outputs.frontend == 'true'
        run: |
          npm run typecheck
          npx vitest run src/data src/lib/family.test.ts src/lib/app-state.test.ts src/lib/diaper-stock.test.ts

      - name: Build app
        if: steps.scope.outputs.frontend == 'true'
        run: npm run build

      - name: Authenticate to Google Cloud
        if: steps.scope.outputs.functions == 'true' || steps.scope.outputs.rules == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TWINLY_PROD }}

      - name: Deploy changed Firebase backend
        if: steps.scope.outputs.functions == 'true' || steps.scope.outputs.rules == 'true'
        shell: bash
        run: |
          targets=""
          if [ "${{ steps.scope.outputs.functions }}" = "true" ]; then
            targets="${{ steps.scope.outputs.function_selector }}"
          fi
          if [ "${{ steps.scope.outputs.rules }}" = "true" ]; then
            targets="${targets:+$targets,}firestore"
          fi
          npx --yes firebase-tools@latest deploy --only "$targets" --project twinly-prod --non-interactive

      - name: Allow app calls to family functions
        if: steps.scope.outputs.functions == 'true'
        run: |
          for service in completefamilyonboarding createfamilyinvite joinfamily; do
            gcloud run services add-iam-policy-binding "$service" \
              --project twinly-prod \
              --region asia-northeast1 \
              --member="allUsers" \
              --role="roles/run.invoker" \
              --quiet
          done

      - name: Verify family function reachability
        if: steps.scope.outputs.functions == 'true'
        run: |
          status="$(curl --silent --show-error --output /tmp/complete-family-onboarding.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"data":{"nickname":"probe","relationship":"father"}}' \
            'https://asia-northeast1-twinly-prod.cloudfunctions.net/completeFamilyOnboarding')"
          test "$status" = "401"

      - name: Deploy app to Firebase Hosting
        if: steps.scope.outputs.frontend == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TWINLY_PROD }}
          projectId: twinly-prod
          channelId: live
