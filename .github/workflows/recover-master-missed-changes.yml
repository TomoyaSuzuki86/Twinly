name: Validate recovered master changes

on:
  push:
    branches:
      - fix/recover-master-missed-changes
    paths:
      - scripts/recover-master-missed-changes.mjs
      - .github/workflows/recover-master-missed-changes.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Install Functions dependencies
        run: npm --prefix functions ci --prefer-offline --no-audit --fund=false

      - name: Apply compatibility recovery
        run: node scripts/recover-master-missed-changes.mjs

      - name: Verify recovered product behavior
        run: |
          test -s public/premium/care-gauge-notice-v2.webp
          grep -q '/premium/care-gauge-notice-v2.webp' src/components/AiTools.tsx
          grep -q 'careNotifications' functions/ai-policy.js
          grep -q 'careNotifications' src/lib/ai.ts
          grep -q 'access.features.careNotifications' functions/reminder-functions.js
          grep -q 'useBrowserBackDismiss' src/components/IntroTutorial.tsx

      - name: Typecheck
        run: npm run typecheck

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Test Functions
        run: npm --prefix functions test

      - name: Syntax-check refactored Functions modules
        run: |
          node --check functions/family-functions.js
          node --check functions/reminder-functions.js
          node --check functions/runtime-context.js
          node --check functions/wear-functions.js

      - name: Commit adapted recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/reminder-functions.js src/components/IntroTutorial.tsx
          if git diff --cached --quiet; then
            echo "No adapted files changed"
            exit 0
          fi
          git commit -m "fix: adapt missed features to refactored modules"
          git push origin HEAD:fix/recover-master-missed-changes
