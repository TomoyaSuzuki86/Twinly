name: Apply developer message copy v2

on:
  push:
    branches:
      - copy/developer-message
    paths:
      - .github/workflows/apply-developer-message-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout copy branch
        uses: actions/checkout@v4

      - name: Update developer message
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('src/components/AiTools.tsx')
          text = path.read_text()
          start_marker = '      <section className="rounded-2xl border bg-gradient-to-br from-primary/10 via-background to-background p-5">\n        <div className="text-sm font-bold text-primary">Twinlyをつくった理由</div>'
          end_marker = '\n\n      <section className="min-w-0 overflow-hidden rounded-xl border">'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('developer message section markers were not found')
          encoded = ''
          replacement = base64.b64decode(encoded).decode('utf-8')
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit copy update and remove helper workflows
        shell: bash
        run: |
          rm .github/workflows/apply-developer-message.yml
          rm .github/workflows/apply-developer-message-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AiTools.tsx .github/workflows/apply-developer-message.yml .github/workflows/apply-developer-message-v2.yml
          git commit -m "copy: rewrite developer message in pricing section"
          git push origin HEAD:copy/developer-message
