name: Cleanup Secret Manager Versions Once

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cleanup-secret-versions-once.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TWINLY_PROD }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Keep latest version and destroy older versions
        shell: bash
        run: |
          set -euo pipefail
          project="twinly-prod"
          secrets=(
            "TWINLY_AI_API_KEY"
            "TWINLY_STRIPE_SECRET_KEY"
            "TWINLY_STRIPE_WEBHOOK_SECRET"
          )

          for secret in "${secrets[@]}"; do
            latest_resource="$(gcloud secrets versions list "$secret"               --project "$project"               --filter="state=ENABLED"               --sort-by="~createTime"               --limit=1               --format="value(name)")"

            if [ -z "$latest_resource" ]; then
              echo "::error::No enabled version found for $secret"
              exit 1
            fi

            latest="${latest_resource##*/}"
            echo "$secret: keeping version $latest"

            mapfile -t versions < <(
              gcloud secrets versions list "$secret"                 --project "$project"                 --filter="state!=DESTROYED"                 --sort-by="createTime"                 --format="value(name)"
            )

            for resource in "${versions[@]}"; do
              version="${resource##*/}"
              if [ "$version" = "$latest" ]; then
                continue
              fi
              echo "$secret: destroying version $version"
              gcloud secrets versions destroy "$version"                 --secret "$secret"                 --project "$project"                 --quiet
            done

            remaining="$(gcloud secrets versions list "$secret"               --project "$project"               --filter="state=ENABLED"               --format="value(name)" | sed '/^$/d' | wc -l | tr -d ' ')"

            if [ "$remaining" -ne 1 ]; then
              echo "::error::$secret still has $remaining enabled versions"
              exit 1
            fi
            echo "$secret: cleanup complete; 1 enabled version remains"
          done
