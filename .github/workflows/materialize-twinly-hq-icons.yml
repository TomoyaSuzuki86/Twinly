name: Materialize High-Quality Twinly Icons
on:
  push:
    branches: [fix/twinly-icon-original-hq-20260923]
    paths:
      - "public/icons/source-twinly-512-v7.webp"
      - "scripts/generate-icons.py"
      - ".github/workflows/materialize-twinly-hq-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/twinly-icon-original-hq-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Generate validated PNGs from the high-quality source
        run: python scripts/generate-icons.py
      - name: Commit generated binaries to fix branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons/*-v7.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(icons): build real PNGs from high-quality source"
            git push origin HEAD:fix/twinly-icon-original-hq-20260923
          fi
