name: Check development isolation
on:
  pull_request:
    paths:
      - '.github/workflows/firebase-hosting-development.yml'
      - '.github/workflows/development-isolation-check.yml'
      - 'scripts/validate-development-config*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/validate-development-config.test.cjs
