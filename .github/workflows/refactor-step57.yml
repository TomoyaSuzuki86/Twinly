name: Validate STEP 5-7 refactor

on:
  push:
    branches:
      - refactor/steps-5-7-finalwork

permissions:
  contents: write

jobs:
  refactor:
    if: "${{ github.event.head_commit.message != 'refactor: apply steps 5-7 codemod' }}"
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply refactor codemod
        run: node scripts/refactor-step57.mjs

      - name: Verify codemod changed expected files
        run: |
          if git diff --quiet -- src/App.tsx src/legacy-dom-enhancers.ts; then
            echo "Expected STEP 5-7 changes were not produced" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Typecheck
        run: npm run typecheck

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/legacy-dom-enhancers.ts
          git commit -m "refactor: apply steps 5-7 codemod"
          git push origin HEAD:refactor/steps-5-7-finalwork
