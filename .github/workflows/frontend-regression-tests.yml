name: Frontend Regression Tests

on:
  pull_request:
    branches:
      - development
      - master
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - ".github/workflows/frontend-regression-tests.yml"
      - ".github/workflows/firebase-hosting-deploy.yml"

permissions:
  contents: read

concurrency:
  group: frontend-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Typecheck
        run: npm run typecheck

      - name: Run full Vitest suite
        run: npm test

      - name: Build
        run: npm run build
