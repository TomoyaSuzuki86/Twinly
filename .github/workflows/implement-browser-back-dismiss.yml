name: Implement browser back overlay dismissal

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/implement-browser-back-dismiss.yml

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.event.head_commit.message == 'chore run browser back overlay dismissal' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply implementation
        run: python scripts/implement_browser_back.py

      - name: Validate implementation
        run: |
          npm ci
          npm run typecheck
          npx vitest run src/lib/use-browser-back-dismiss.test.tsx src/components/SettingsModal.test.tsx

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-browser-back-dismiss.yml scripts/implement_browser_back.py
          git add src/lib/use-browser-back-dismiss.ts src/lib/use-browser-back-dismiss.test.tsx src/components/ui/dialog.tsx src/components/IntroTutorial.tsx
          git commit -m "feat: close overlays on browser back"
          git push origin HEAD:master
