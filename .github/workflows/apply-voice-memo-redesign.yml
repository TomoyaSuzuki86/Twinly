name: Apply voice memo redesign

on:
  push:
    branches:
      - agent/voice-memo-targeting

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Capture voice memo test failure'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        run: |
          python3 scripts/apply-voice-memo-redesign.py
          python3 scripts/fix-voice-memo-redesign.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: |
          set +e
          npm test 2>&1 | tee voice-memo-test-output.txt
          status=${PIPESTATUS[0]}
          exit $status

      - name: Capture test failure
        if: failure()
        run: |
          cp voice-memo-test-output.txt /tmp/voice-memo-test-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          git clean -fd
          cp /tmp/voice-memo-test-output.txt voice-memo-test-output.txt
          git add voice-memo-test-output.txt
          git commit -m "Capture voice memo test failure"
          git push

      - name: Build
        run: npm run build

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine voice input targeting and shared memos"
          git push
