name: Apply voice memo redesign

on:
  push:
    branches:
      - agent/voice-memo-targeting

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        run: |
          python3 scripts/apply-voice-memo-redesign.py
          python3 scripts/fix-voice-memo-redesign.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Voice memo regression tests
        run: npm test -- src/lib/voice-command.test.ts src/lib/voice-command.target.test.ts src/components/BabyPanel.test.tsx

      - name: Static feature assertions
        run: |
          ! grep -q '音声入力名' src/components/SettingsModal.tsx
          ! grep -q 'parseVoiceAliases' src/components/SettingsModal.tsx
          grep -q 'sharedDailyId' src/components/DailyReportModal.tsx
          grep -q 'sharedDailyId' src/App.tsx
          grep -q 'forcedBabyId: "both"' src/lib/voice-command.target.test.ts

      - name: Build
        run: npm run build

      - name: Clean diagnostic files
        run: rm -f voice-memo-test-output.txt

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine voice input targeting and shared memos"
          git push
