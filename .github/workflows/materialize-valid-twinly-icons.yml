name: Materialize Valid Twinly PNG Icons

on:
  push:
    branches:
      - fix/icon-assets-valid-png-20260923
    paths:
      - public/icons/icon-192-v5.png
      - .github/workflows/materialize-valid-twinly-icons.yml

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/icon-assets-valid-png-20260923

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image encoder
        run: python -m pip install Pillow==11.3.0

      - name: Derive and verify real PNG files
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          from hashlib import sha256
          source = Path('public/icons/icon-192-v5.png')
          im = Image.open(source)
          im.verify()
          im = Image.open(source).convert("RGB")
          assert im.size == (192, 192), "Source PNG must actually be 192x192"
          outdir = source.parent
          for name, size in [('icon-512-v5.png',512), ('apple-touch-icon-v5.png',180), ('favicon-32-v5.png',32)]:
              target = outdir / name
              im.resize((size,size), Image.Resampling.LANCZOS).save(target, "PNG", optimize=True)
              with Image.open(target) as check:
                  check.verify()
              with Image.open(target) as check:
                  assert check.format == "PNG" and check.size == (size,size) and check.getbbox()
              print(f"{target}: {size}x{size} verified sha256={sha256(target.read_bytes()).hexdigest()}")
          PY

      - name: Commit generated PNGs to this fix branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons/icon-512-v5.png public/icons/apple-touch-icon-v5.png public/icons/favicon-32-v5.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: materialize verified PNG icon sizes from valid source"
            git push origin HEAD:fix/icon-assets-valid-png-20260923
          fi
