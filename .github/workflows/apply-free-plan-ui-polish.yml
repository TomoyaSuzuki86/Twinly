name: Apply Free Plan UI Polish

on:
  push:
    branches:
      - development
    paths:
      - .github/workflows/apply-free-plan-ui-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply source changes
        run: python3 scripts/apply-free-plan-ui-polish.py

      - name: Install dependencies
        run: npm ci

      - name: Test AI advice launcher
        run: npx vitest run src/components/AiAdviceLauncher.test.tsx

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Remove temporary patch files
        run: rm scripts/apply-free-plan-ui-polish.py .github/workflows/apply-free-plan-ui-polish.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish free plan UI and twin tab transition"
          git push origin HEAD:development
